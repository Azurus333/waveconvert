<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAVE⚡CONVERT</title>
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-darker: #050508;
            --accent: #00ff88;
            --text: #e0e0e0;
            --text-dim: #888;
            --border: #333;
            --glow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 9999;
            opacity: 0.3;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: glitch 2s infinite;
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-2px, 2px); }
            94% { transform: translate(2px, -2px); }
            96% { transform: translate(-2px, -2px); }
            98% { transform: translate(2px, 2px); }
        }

        h1 {
            font-size: 3rem;
            color: var(--accent);
            text-shadow: var(--glow);
            letter-spacing: 0.3em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1rem;
            letter-spacing: 0.2em;
        }

        .input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        input[type="url"] {
            flex: 1;
            min-width: 250px;
            padding: 1rem;
            background: var(--bg-darker);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="url"]:focus {
            border-color: var(--accent);
            box-shadow: var(--glow);
        }

        select {
            padding: 1rem;
            background: var(--bg-darker);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--accent);
        }

        button {
            padding: 1rem 2rem;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        button:hover {
            background: var(--accent);
            color: var(--bg-dark);
            box-shadow: var(--glow);
        }

        button:active {
            transform: scale(0.98);
        }

        .status {
            margin-top: 2rem;
            padding: 1rem;
            background: var(--bg-darker);
            border: 1px solid var(--border);
            border-radius: 4px;
            min-height: 50px;
            font-family: monospace;
            white-space: pre-wrap;
            color: var(--accent);
            overflow-y: auto;
            max-height: 200px;
        }

        .progress-container {
            margin-top: 1rem;
            width: 100%;
            height: 4px;
            background: var(--bg-darker);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
            box-shadow: var(--glow);
        }

        .preview {
            margin-top: 2rem;
            display: none;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            text-align: center;
        }

        .preview img {
            max-width: 300px;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: var(--glow);
        }

        .preview h3 {
            color: var(--text);
            font-size: 1.2rem;
        }

        .preview p {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            .input-group {
                flex-direction: column;
            }
            input[type="url"] {
                width: 100%;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>WAVE⚡CONVERT</h1>
            <p class="subtitle">CONVERTISSEUR AUDIO ULTRA-RAPIDE</p>
        </header>

        <div class="input-group">
            <input type="url" id="urlInput" placeholder="Collez le lien YouTube, SoundCloud, Twitch, etc..." required>
            <select id="formatSelect">
                <option value="mp3">MP3</option>
                <option value="wav">WAV</option>
                <option value="ogg">OGG</option>
                <option value="m4a">M4A</option>
            </select>
            <button id="convertBtn">CONVERTIR</button>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="status" id="status">
            Prêt à convertir...
        </div>

        <div class="preview" id="preview">
            <img id="previewImg" alt="Aperçu">
            <h3 id="previewTitle">Titre de la vidéo</h3>
            <p id="previewChannel">Chaîne</p>
        </div>

        <footer>
            <p>Powered by DePIN Network | Conversion ultra-rapide et sécurisée</p>
        </footer>
    </div>

    <script>
        const API = 'https://api-convert.revolution-network.fr';
        const urlInput = document.getElementById('urlInput');
        const formatSelect = document.getElementById('formatSelect');
        const convertBtn = document.getElementById('convertBtn');
        const statusEl = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const preview = document.getElementById('preview');
        const previewImg = document.getElementById('previewImg');
        const previewTitle = document.getElementById('previewTitle');
        const previewChannel = document.getElementById('previewChannel');

        let eventSource = null;

        convertBtn.addEventListener('click', startConversion);
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startConversion();
        });

        async function startConversion() {
            const url = urlInput.value.trim();
            const format = formatSelect.value;

            if (!url) {
                statusEl.textContent = '⚠️ Veuillez entrer une URL valide';
                return;
            }

            if (eventSource) eventSource.close();
            progressBar.style.width = '0%';
            preview.style.display = 'none';
            statusEl.textContent = '🔍 Vérification de l\'URL...';

            try {
                const infoResp = await fetch(`${API}/api/info`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                if (!infoResp.ok) throw new Error('URL invalide');

                const info = await infoResp.json();
                showPreview(info);

                statusEl.textContent = '⚡ Conversion en cours...';
                progressBar.style.width = '10%';

                eventSource = new EventSource(`${API}/api/convert?url=${encodeURIComponent(url)}&format=${format}`);

                eventSource.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.step === 'extract') {
                        statusEl.textContent = '🎵 Extraction de l\'audio...';
                        progressBar.style.width = '25%';
                    } else if (data.step === 'convert') {
                        statusEl.textContent = '🔄 Conversion en cours...';
                        progressBar.style.width = '50%';
                    } else if (data.step === 'processing') {
                        statusEl.textContent = data.message || '⏳ Traitement par le réseau...';
                        progressBar.style.width = '75%';
                    } else if (data.step === 'ready') {
                        statusEl.textContent = '✅ Prêt !';
                        progressBar.style.width = '90%';
                    }
                };

                eventSource.addEventListener('done', (event) => {
                    if (event.data) {
                        const data = JSON.parse(event.data);
                        progressBar.style.width = '100%';
                        statusEl.textContent = '✅ Téléchargement prêt !';

                        // ⬇️⬇️⬇️ CORRECTION : FORCE LE TÉLÉCHARGEMENT ⬇️⬇️⬇️
                        const a = document.createElement('a');
                        a.href = data.downloadUrl;
                        a.download = data.filename || `audio.${data.format}`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);

                        setTimeout(() => {
                            progressBar.style.width = '0%';
                            statusEl.textContent = 'Prêt pour une nouvelle conversion !';
                        }, 3000);
                    }
                    if (eventSource) eventSource.close();
                });

                eventSource.addEventListener('error', (event) => {
                    if (event.data) {
                        const data = JSON.parse(event.data);
                        statusEl.textContent = `❌ Erreur : ${data.message || 'Conversion échouée'}`;
                    } else {
                        statusEl.textContent = '❌ Erreur de connexion';
                    }
                    progressBar.style.width = '0%';
                    if (eventSource) eventSource.close();
                });

            } catch (error) {
                statusEl.textContent = `❌ Erreur : ${error.message}`;
                progressBar.style.width = '0%';
            }
        }

        function showPreview(info) {
            previewImg.src = info.thumbnail || 'https://via.placeholder.com/300x169?text=No+Preview';
            previewTitle.textContent = info.title || 'Titre inconnu';
            previewChannel.textContent = info.channel || 'Chaîne inconnue';
            preview.style.display = 'flex';
        }
    </script>
</body>
</html>
